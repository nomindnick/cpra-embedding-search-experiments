# EXP-025e: Contrastive scoring with gemma3:4b - positive only
# Compare gemma3:4b prototype generation vs ministral-3:3b
# Variant: max_sim(email, positives) with lambda=0 (no negative penalty)
name: "025e Contrastive Positive Only (gemma)"

pipeline:
  method: contrastive

contrastive:
  embedding_model: st:all-mpnet-base-v2
  llm_model: gemma3:4b
  num_positive: 5
  num_negative: 0
  use_negatives: false
  lambda_negative: 0.0
  scoring_method: max
  verbose: true
  save_prototypes_to: results/025e_contrastive_gemma_positive/prototypes.json

evaluation:
  k_values: [50, 100, 150, 200]
  thresholds: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
