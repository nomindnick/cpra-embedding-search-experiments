# Snowflake Arctic Embed L v2.0 - Best performer from v1 experiments
# Achieved 95.20% recall, 86.02% precision, 90.38% F1, 0.9920 MAP at threshold 0.50
name: "002 Snowflake Arctic L v2.0"

pipeline:
  method: embedding

embedding_model: st:snowflake-arctic-embed-l-v2.0

evaluation:
  k_values: [50, 100, 150, 200]
