# EXP-025f: Contrastive scoring with gemma3:4b - max aggregation
# Compare gemma3:4b prototype generation vs ministral-3:3b
# Variant: max_sim(pos) - lambda * max_sim(neg)
name: "025f Contrastive Max (gemma)"

pipeline:
  method: contrastive

contrastive:
  embedding_model: st:all-mpnet-base-v2
  llm_model: gemma3:4b
  num_positive: 5
  num_negative: 5
  use_negatives: true
  lambda_negative: 0.5
  scoring_method: max
  verbose: true
  save_prototypes_to: results/025f_contrastive_gemma_max/prototypes.json

evaluation:
  k_values: [50, 100, 150, 200]
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
