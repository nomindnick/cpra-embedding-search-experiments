# EXP-025c: Contrastive scoring with mean aggregation
# Tests mean vs max aggregation for prototype similarity
# Variant: mean_sim(pos) - lambda * mean_sim(neg)
name: "025c Contrastive Mean"

pipeline:
  method: contrastive

contrastive:
  embedding_model: st:all-mpnet-base-v2
  llm_model: ministral-3:3b
  num_positive: 5
  num_negative: 5
  use_negatives: true
  lambda_negative: 0.5
  scoring_method: mean

evaluation:
  k_values: [50, 100, 150, 200]
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
