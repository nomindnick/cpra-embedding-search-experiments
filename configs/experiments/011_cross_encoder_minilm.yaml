# Cross-Encoder MS-MARCO MiniLM - Direct relevance scoring
# Unlike bi-encoders, cross-encoders process query+document together
# More accurate but slower (can't pre-compute document embeddings)
# Expected: 5-10% accuracy improvement over bi-encoders
name: "011 Cross-Encoder MiniLM-L-6"

pipeline:
  method: cross_encoder

cross_encoder_model: ms-marco-MiniLM-L-6-v2

evaluation:
  k_values: [50, 100, 150, 200]
  # Cross-encoder scores are typically in different range than cosine similarity
  # MS-MARCO models output logits - on v2 corpus scores range from -10 to -0.66
  thresholds: [-9.0, -8.0, -7.0, -6.0, -5.0, -4.0, -3.0, -2.5, -2.0, -1.5]
