# EXP-025h: Contrastive scoring with gemma3:12b - max aggregation
# Test if larger LLM produces better prototypes than gemma3:4b
# Variant: max_sim(pos) - lambda * max_sim(neg)
name: "025h Contrastive Max (gemma-12b)"

pipeline:
  method: contrastive

contrastive:
  embedding_model: st:all-mpnet-base-v2
  llm_model: gemma3:12b
  num_positive: 5
  num_negative: 5
  use_negatives: true
  lambda_negative: 0.5
  scoring_method: max
  verbose: true
  llm_timeout: 600
  save_prototypes_to: results/025h_contrastive_gemma12b_max/prototypes.json

evaluation:
  k_values: [50, 100, 150, 200]
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
