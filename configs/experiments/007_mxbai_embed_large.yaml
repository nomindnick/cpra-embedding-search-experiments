# mxbai-embed-large via Ollama - Best MAP in v1 (0.9818)
# 1024 dimensions, good ranking quality
# Did not meet 94% recall requirement but excellent precision
name: "007 mxbai-embed-large"

pipeline:
  method: embedding

embedding_model: ollama:mxbai-embed-large

evaluation:
  k_values: [50, 100, 150, 200]
  thresholds: [0.30, 0.40, 0.50, 0.60, 0.65, 0.70, 0.75, 0.80]
