# EXP-027b: RRF Ensemble - mpnet + BGE-Large
# Rationale: Best precision on each corpus
# mpnet: Best precision on Lead (57.74%)
# BGE-Large: Best precision on PFAS (70.59%), 100% recall both corpora
name: "027b RRF mpnet + BGE-Large"

pipeline:
  method: ensemble

ensemble:
  method: rrf
  rrf_k: 60
  pipelines:
    - model: st:all-mpnet-base-v2
      weight: 1.0
    - model: st:bge-large-en-v1.5
      weight: 1.0

evaluation:
  k_values: [50, 100, 150, 200]
  thresholds: [0.001, 0.002, 0.003, 0.004, 0.005, 0.006, 0.007, 0.008, 0.009, 0.010, 0.012, 0.015, 0.020]
