# Voyage 4 Nano - Baseline (standard encode)
# 340M params, 2048 dimensions, 32K context, supports Matryoshka
name: "020 Voyage 4 Nano Baseline"

pipeline:
  method: embedding

embedding_model: st:voyage-4-nano

evaluation:
  k_values: [50, 100, 150, 200]
  thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
